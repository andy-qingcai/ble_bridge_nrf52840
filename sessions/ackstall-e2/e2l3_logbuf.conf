# E2-L3 (0.5.3-ackstall) = E2-L2 + log-buffer rework, boot-window fix.
# Base conf e2l_log.conf is passed FIRST in the app_EXTRA_CONF_FILE list;
# this delta file is merged LAST (CMake list order = Kconfig merge order),
# so the two lines below are the ONLY difference vs E2-L2.
#
# Problem: USB enumeration + host DTR gap structurally drops the boot log
# section (bt_enable / settings / bond load) -- earliest host-visible line
# measured at t~5s after reset.
#  - LOG_BUFFER_SIZE 1024 (Kconfig.processing:121 default) -> 16384: the
#    deferred-mode message pool now holds the whole boot section until the
#    host opens cdc2 (DTR) and the flush drains it.
#  - LOG_MODE_OVERFLOW n (was y from e2l_log.conf): "current message is
#    dropped" when full instead of oldest -- early boot lines are the ones
#    kept, flooding cannot evict them.
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_MODE_OVERFLOW=n
