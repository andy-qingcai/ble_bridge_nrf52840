# E2-PB2 (0.6.2-ackstall): buffer-pool expansion ONLY, on top of the E2-T
# working tree (adv_type fix + three-port log routing unchanged).
#
# Motivation (P0 OTA ACK stall, HCI现场): bt_conn "Unable to allocate buffer
# with K_NO_WAIT" -> host TX pool exhaustion freezes the controller->host
# pipeline -> ACK timeout.  4KB blocks x 247B MTU = ~17 ACL fragments/block,
# pipeline window 3 -> ~50 fragments in flight vs TX pools of 10.
#
# Six symbols, names verified against the generated .config of
# build-ackstall-e2t (NCS v3.4.1 / Zephyr 4.4.2, SDC controller):
#   BT_CONN_TX_MAX            host/Kconfig (E2-T .config:143 default 10 -> 20)
#   BT_L2CAP_TX_BUF_COUNT     host/Kconfig.l2cap (E2-T .config:577 10 -> 20)
#   BT_BUF_EVT_RX_COUNT       common/Kconfig (E2-T .config:88 12 -> 32)
#   BT_BUF_ACL_RX_COUNT_EXTRA common/Kconfig (E2-T .config:512 6 -> 16)
#   BT_CTLR_SDC_RX_PACKET_COUNT nrf controller/Kconfig (E2-T .config:317 2 -> 6)
#   BT_CTLR_SDC_TX_PACKET_COUNT nrf controller/Kconfig (E2-T .config:316 3 -> 6)
#
# Differences vs the earlier e2pb_buf.conf (E2-P+B, 19:06): RX_STACK_SIZE and
# the "P" priority leg are NOT in scope here; this fragment is purely the six
# buffer/count lines named by the E2-PB2 task.
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=20
CONFIG_BT_BUF_EVT_RX_COUNT=32
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=16
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=6
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=6
