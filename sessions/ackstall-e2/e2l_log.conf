# E2-L (0.5.0-ackstall): E0c full baseline + logging/assertions ONLY.
# Goal: capture Zephyr host bt_hci_le_enh_conn_complete "No pending conn"
# path + bond/addr-translation traces on the device connect-timeout signature.
#
# Log outlet must be UART0 (DK J-Link OB VCOM), NEVER the app's two CDC
# instances (cdc_acm_uart0=protocol, cdc_acm_uart1=SMP).  Binding evidence
# (verified against this tree before building):
#   - subsys/logging/backends/log_backend_uart.c:38-39 binds
#     DT_CHOSEN(zephyr_log_uart) if present, else DT_CHOSEN(zephyr_console);
#   - no zephyr,log-uart chosen exists in app overlay/board dts
#     -> falls through to zephyr,console;
#   - board dts sets zephyr,console = &uart0 (the app overlay only retargets
#     zephyr,uart-mcumgr to cdc_acm_uart1) -> logs go to uart0 pins
#     = J-Link OB VCOM, unreachable from the USB CDC instances;
#   - Kconfig.uart:6 `depends on UART_CONSOLE` while prj.conf carries
#     CONFIG_UART_CONSOLE=n: the explicit CONFIG_UART_CONSOLE=y flip below
#     is MANDATORY or LOG_BACKEND_UART would silently/warn-err drop to n.
#     UART_CONSOLE's device is the same chosen zephyr,console = &uart0.
# uart0 runs 921600 8N1 + RTS/CTS per the app overlay (board pins P0.06/08,
# flow P0.05/07 -> J-Link OB VCOM).
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_ASSERT=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# NOTE: the *_LOG_LEVEL ints have no prompt (Kconfig.template.log_config) --
# their CHOICE symbols are the user-facing form (3=INF, 4=DBG).
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
