# suota_sim HIL 严格校验形态（task(12) 终审 I-2）。
#
# 本文件不会被 Zephyr 自动合入（自动合入只认 boards/<board>.conf 精确名）；
# 仅当 `tools/flash.sh suota_sim --hil` 以
#   -DEXTRA_CONF_FILE=boards/nrf52840dk_nrf52840_hil.conf
# 附加时生效。默认（快速冒烟）构建保持两个校验都关。
#
# HIL 严格验收 = END 时同时校验:
#   - 累计字节数 == EXPECTED_SIZE（不符 -> 0x13 INVALID_IMAGE_SIZE）
#   - 全程 running XOR == 0（不符 -> 0x04 CRC_MISMATCH）

CONFIG_SUOTA_SIM_CHECK_XOR=y

# tools/hil_test.py full(G2) 默认合成镜像 640KiB = 655360 B；
# SUOTA 上传体 = 镜像 + 1B 全文件 XOR 校验字节 = 655361 B。
# 改 hil_test.py --image-bytes（或 --image）时必须同步改这里。
CONFIG_SUOTA_SIM_EXPECTED_SIZE=655361
