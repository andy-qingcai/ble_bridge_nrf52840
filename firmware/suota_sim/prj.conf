# suota_sim - SUOTA peripheral simulator - nrf52840dk/nrf52840.

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# ---------------------------------------------------------------------------
# Core behavior under test (FR-E2): the simulator sends ATT_EXCHANGE_MTU_REQ
# immediately after the connection is established, before doing anything
# else (peripheral-initiated MTU exchange, AN-B-022 reference behavior).
#
# CONFIG_BT_GATT_CLIENT is a *compile-time* gate for bt_gatt_exchange_mtu()
# and the MTU_RSP handler - it does NOT change our role.
# CONFIG_BT_GATT_AUTO_UPDATE_MTU makes the stack send the MTU request by
# itself the instant the ATT bearer comes up (before the application
# connected callback), which is exactly the behavior under test, with zero
# application code.  Verified against NCS v3.4.1 / Zephyr 4.4.2.
# ---------------------------------------------------------------------------
CONFIG_BT_GATT_CLIENT=y            # compile gate for the MTU-REQ path (quirk switch)
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y   # connect => automatic MTU_REQ (quirk switch)

# The request value is MIN(BT_L2CAP_TX_MTU, BT_BUF_ACL_RX_SIZE - 4).
# 251/255 => the suota_sim requests ATT MTU 251, matching the reference
# device (SUOTA MTU characteristic = 251) and accepts
# 244-byte PATCH_DATA writes.  Defaults (23/27) would cap us at MTU 23.
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
# 244 B fits in one packet; no long writes.
CONFIG_BT_ATT_PREPARE_COUNT=0

# Sane headroom for the per-block 0x02 notifications.
CONFIG_BT_CONN_TX_MAX=10

# No pairing/bonding: SUOTA runs in the clear (AN-B-022),
# all characteristics use plain (non-encryption-required) permissions.

# Observability: every state transition / validation error goes to Zephyr LOG
# (RTT or UART console per board defaults - this app has no protocol stream
# that could be polluted).
CONFIG_LOG=y

# Runtime image accounting only (no real flash storage of the image).
# The 4 KiB header buffer (SUOTA_SIM_KEEP_HEADER) is plain RAM.

# Address persistence for SUOTA_SIM_ADDR_MODE="nvs" (storage_partition on
# the nrf52840dk devicetree).  Compiled in unconditionally so the NVS path
# stays compile-checked by the build gate even in the default "fixed" mode.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Skeleton hygiene, same bar as the bridge app.
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_BUILD_OUTPUT_HEX=y

# bt_enable() + address setup run on the main thread; notifies run on the
# system workqueue.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
