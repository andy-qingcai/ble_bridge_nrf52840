# Self-OTA (task-dfu-a): sysbuild + MCUboot dual-slot baseline.
#
# Eval report docs/reports/dfu-usbcdc-eval-20260926.md §6.1.  Enabling the
# bootloader switches the build to NCS sysbuild mode.  Partition freeze,
# NCS v3.4.1 finding: on nrf52840dk this NCS does NOT engage the Nordic
# partition manager -- the layout comes from the devicetree fixed
# partitions (zephyr/dts/vendor/nordic/nrf52840_partition.dtsi).  The
# reproducible "frozen" layout is therefore the committed overlay pair
#   - boards/nrf52840dk_nrf52840.overlay  (app; sysbuild.conf also makes
#     a plain `west build` a sysbuild build, so this map covers ALL builds)
#   - sysbuild/mcuboot.overlay            (bootloader, same map)
# which must stay byte-consistent; see those files for the measured 48K vs
# 80K decision (serial recovery needs ~60 KiB).
#
# Upgrade mode: MCUBOOT_MODE_SWAP_USING_MOVE (the NCS choice default in
# nrf/sysbuild/Kconfig.mcuboot; sibling of swap-using-scratch/offset).  Both
# non-scratch swap modes keep the "trial + confirm + revert" semantics that
# is the brick-proof core: an unconfirmed image is swapped back by MCUboot
# on the next reset.  nRF52840 has uniform 4 KB pages (nrf52840.dtsi
# erase-block-size), which satisfies the homogeneous-page requirement of
# offset/move; no scratch partition is needed.  Kept at the default instead
# of pinning a mode: the default tracks NCS recommendations across releases.
# (Verified in build-dfu/mcuboot/zephyr/.config: BOOT_SWAP_USING_MOVE=y,
# SINGLE_APPLICATION_SLOT unset, UPDATEABLE_IMAGE_NUMBER=1.)
#
# Signature: BOOT_SIGNATURE_TYPE_ECDSA_P256 is already the sysbuild default
# for nRF52840 (nrf/sysbuild/Kconfig.mcuboot BOOT_SIGNATURE_TYPE choice).
# The signing key is user-generated (NOT committed; see ci/keys/ -- generate
# with: openssl ecparam -name prime256v1 -genkey -noout -out <key>.pem).
# The key path must be absolute or relative to the app config dir /
# west topdir (zephyr/cmake/mcuboot.cmake resolution order), so tools/
# build-dfu.sh injects it as an absolute -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE.
# A plain `west build` without that flag falls back to the MCUboot tree's
# root-ec-p256.pem test key: the build succeeds but the images would not be
# verifiable by a bootloader built with your key -- always build
# through tools/build-dfu.sh for anything that gets flashed.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# One merged hex per board target (mcuboot + app slots): the artifact
# WCH-Link/pyocd flashes for the whole-image bring-up.
SB_CONFIG_MERGED_HEX_FILES=y
