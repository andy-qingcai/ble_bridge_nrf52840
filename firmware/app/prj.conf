# BLE bridge firmware (Task 9 data plane, Task 10 BLE central) - nrf52840dk/nrf52840
#
# Data plane: USB CDC ACM (primary) / UART0 (backup), framing + dispatch +
# credit flow control.  Zephyr LOG is intentionally OFF: the bridge has its
# own EVT.DEBUG log channel on the protocol stream.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

# CMD.reset performs sys_reboot(SYS_REBOOT_COLD) after the best-effort ACK.
CONFIG_REBOOT=y

# Native USB device stack (new stack, Zephyr 4.x) + CDC ACM class.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y

# The protocol stream owns cdc_acm_uart0 end to end: no Zephyr
# console/printk sink and no LOG subsystem on the same UART (the bridge's
# log channel is EVT.DEBUG on the protocol stream itself).  Threads are the
# whole app.
# task-dfu-a: CONFIG_CONSOLE flips to y because MCUMGR_TRANSPORT_UART
# depends on CONSOLE (zephyr/subsys/mgmt/mcumgr/transport/Kconfig.uart:20).
# UART_CONSOLE stays n -- no console backend attaches anywhere, so nothing
# ever writes to either CDC port except the bridge protocol (port 0) and
# the SMP transport (port 1); the flip is a dependency formality verified
# by the crosstalk regression in the task report.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_MULTITHREADING=y

# Skeleton hygiene: asserts on, thread names for debugging, hex artifact
# for the build gate report.CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_BUILD_OUTPUT_HEX=y

# ---- BLE central (Task 10; symbol names verified against NCS v3.4.1) ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
# FR-H multi-role: 1 central (host-initiated device link) + 1 peripheral
# (phone/tool connecting to the bridge's own services) concurrently.
CONFIG_BT_MAX_CONN=2

# ---- BLE peripheral (FR-H) ----
# GATT server role: the preset 0xFFE0 test service (compile-time) plus
# host-defined services via CMD.gatt_define (runtime registration).
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# GATT client operations + automatic ATT MTU exchange on connect (works for
# the central role too; verified against NCS v3.4.1 / Zephyr 4.4.2).
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# 244-byte characteristic payloads: local ATT MTU halves are
#   TX = CONFIG_BT_L2CAP_TX_MTU (247)
#   RX = CONFIG_BT_BUF_ACL_RX_SIZE - 4 (247)
# and the buffers must carry the 4-byte L2CAP header + 247 ATT bytes.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Buffer counts: 244-byte notify bursts arrive as up to 10 ACL fragments;
# defaults (TX 3) would congest.  RX pool = BT_MAX_CONN + 1 + EXTRA.
# HCI event buffers must stay above the ACL TX count (build-time assert).
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6
CONFIG_BT_BUF_EVT_RX_COUNT=12

# Data Length Update + 2M PHY on connect (central preference; SDC has no
# separate "enable 2M" switch - docs/research/nordic-stack-eval.md).
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_CENTRAL_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# Nordic GATT Discovery Manager (NCS): 0xFEF5 discovery at connect.  Runs
# on the system workqueue (saves the dedicated workq thread), map sized for
# the SUOTA service.
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_DM_WORKQ_SYS=y
CONFIG_BT_GATT_DM_MAX_ATTRS=64

# bt_gatt_dm allocates the discovered attr array from the system heap, but
# the module only adds 512B of its own (HEAP_MEM_POOL_ADD_SIZE_BT_GATT_DM).
# A full 0xFEF5 service (~25 attrs) needs more: with the default heap of
# 0 the dm fails with -ENOMEM (-12) exactly when the service IS found
# (random devices without 0xFEF5 mask this - bring-up 2026-09-25).
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Host create timeout must bracket CONFIG_BRIDGE_CONNECT_TIMEOUT_MS (5 s).
CONFIG_BT_CREATE_CONN_TIMEOUT=5

# ---- SMP pairing/encryption (FR-B5) ----
# Session-scoped LE pairing so the host can raise the link to L2 (Just Works:
# the stack reports NoInputNoOutput when no auth callbacks provide IO -- smp.c
# get_io_capa(); unauthenticated pairing, L2 encryption only).
CONFIG_BT_SMP=y
# Bond persistence (settings/FS) is deliberately out of FR-B5 scope: keys live
# in RAM for the session only; a serial CMD.reset drops them.  (Explicit over
# implicit: default is n; flipping it later needs SETTINGS + an NVS backend.)
CONFIG_BT_SETTINGS=n
# FR-H peripheral likewise runs unencrypted/unpaired: the test services are
# plain-text by design (no bond, no SETTINGS backend needed).

# ---- Self-OTA infrastructure (task-dfu-a) --------------------------------
# CONFIG_BOOTLOADER_MCUBOOT is intentionally NOT set here: sysbuild injects
# it into the app image when SB_CONFIG_BOOTLOADER_MCUBOOT=y
# (zephyr/share/sysbuild/image_configurations/MAIN_image_default.cmake:8),
# and setting it unconditionally would wrongly header-offset the legacy
# single-slot flow (tools/flash.sh) which links at 0x0 without a
# bootloader.  The dual-slot partition map (80K bootloader variant) lives
# in boards/nrf52840dk_nrf52840_dfu80.overlay, applied by build-dfu.sh.
# IMG_MANAGER depends on STREAM_FLASH (zephyr/subsys/dfu/Kconfig:8) and
# MCUBOOT_IMG_MANAGER depends on FLASH_MAP -- all requested explicitly,
# exactly like the smp_svr authority sample (FLASH=y is also its first
# entry; omitting it makes STREAM_FLASH_INSPECT y-select FLASH_PAGE_LAYOUT
# whose FLASH dependency fails -> Kconfig warning-as-error).
CONFIG_FLASH=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# MCUmgr SMP over the second CDC ACM (zephyr,uart-mcumgr = &cdc_acm_uart1).
# Transport deps (Kconfig.uart): CONSOLE (flipped above), BASE64, CRC,
# UART_MCUMGR.  Auth is deliberately absent (intratable internal tool on a
# lab USB link; the group set below is image upload/test/confirm + os
# reset -- the minimum for the DFU loop).
CONFIG_UART_MCUMGR=y
# MCUMGR depends on NET_BUF + ZCBOR (subsys/mgmt/mcumgr/Kconfig:7-8);
# both explicit like the smp_svr authority sample.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Frame MTU 1024 (<= MCUMGR_TRANSPORT_NETBUF_SIZE+2; NETBUF raised from the
# 384 default so the relation holds).  4 netbufs x 1024 B ~= 4 KB RAM.
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1024
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Application self-confirmation: RETENTION_BOOT_MODE exposes bootmode_set()
# for CMD.enter_dfu (GPREGRET -> MCUboot serial recovery); the chosen
# zephyr,boot-mode node lives in the board file (boot_mode0 under gpregret1).
# Dependency chain to spell out (all three, or the tail silently drops to n):
# RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE; the GPREGRET retained-mem
# driver defaults on once RETAINED_MEM is y (DT_HAS_NORDIC_NRF_GPREGRET).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# The confirm thread (main.c) waits BRIDGE_CONFIRM_DELAY_MS of stable
# uptime, checks bridge health counters, then boot_write_img_confirmed().
# A image that dies before that point is reverted by MCUboot on reset.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_BRIDGE_CONFIRM_DELAY_MS=10000
CONFIG_BRIDGE_CONFIRM_THREAD_STACK=1024
