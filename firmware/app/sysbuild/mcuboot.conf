# MCUboot child-image configuration (task-dfu-a, plan B fallback layer).
#
# Auto-applied by sysbuild: <app>/sysbuild/mcuboot.conf is picked up as the
# EXTRA_CONF_FILE of the "mcuboot" child image (zephyr/share/sysbuild/cmake/
# modules/sysbuild_extensions.cmake, sysbuild_image_conf_fragment).
#
# Serial recovery = the "last resort" channel of the A1+B composite:
# CMD.enter_dfu (GPREGRET boot mode) or a missing/broken application drops
# the device into this bootloader, which serves MCUmgr SMP over its own USB
# CDC ACM (host: smpclient / nrfutil device xfer, PID 0x8523 by default).
# Config set follows the in-tree authority samples:
#   - nrf/samples/bluetooth/mesh/dfu/target/sysbuild/mcuboot/boards/
#     nrf52840dongle_nrf52840.conf (serial + USB + no UART console)
#   - bootloader/mcuboot/boot/zephyr/Kconfig.serial_recovery
#     (BOOT_SERIAL_BOOT_MODE / BOOT_SERIAL_NO_APPLICATION entrances)

# ---- serial recovery core ------------------------------------------------
CONFIG_MCUBOOT_SERIAL=y
# CDC ACM: selects the legacy USB_DEVICE_STACK on nRF52840 (the bootloader
# is an independent image; the app keeps USB_DEVICE_STACK_NEXT).
CONFIG_BOOT_SERIAL_CDC_ACM=y
# Entrances:
CONFIG_BOOT_SERIAL_BOOT_MODE=y      # GPREGRET boot-mode (CMD.enter_dfu)
# Dependency chain RETAINED_MEM -> RETENTION -> RETENTION_BOOT_MODE must be
# explicit (BOOT_SERIAL_BOOT_MODE depends on the tail; a missing link makes
# the =y assignment silently drop to n -- Kconfig warning only).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y # no valid app -> stay recoverable
# BOOT_SERIAL_ENTRANCE_GPIO defaults to y (DK button); kept.

# ---- serial/USB plumbing (mirrors the dongle authority sample) ----------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_GPIO=y
CONFIG_MULTITHREADING=y
# No Zephyr console/log on any UART: boot_serial owns the CDC ACM device
# (compile-time guard in serial_adapter.c rejects a console on the same
# device), and LOG is pure flash cost in a bootloader.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# USB descriptors: pin VID:PID to the Nordic serial-recovery identity
# 1915:8523 (BOOT_SERIAL_CDC_ACM_STRING_* only drive the *_usb_next.c path;
# on nRF52840 the legacy USB_DEVICE_STACK descriptors come from
# USB_DEVICE_VID/PID, whose upstream defaults are 0x2FE3:0x0100).  The host
# uses PID 0x8523 to tell "device is in bootloader serial recovery" apart
# from the bridge CDC ports.
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x8523
CONFIG_USB_DEVICE_PRODUCT="blebridge-boot"
