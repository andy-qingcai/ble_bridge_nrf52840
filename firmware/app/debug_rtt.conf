# Bring-up diagnostics: Zephyr log over SEGGER RTT (SWD), does not touch UART0 pins.
# 用法: 构建 -DEXTRA_CONF_FILE=<repo>/firmware/app/debug_rtt.conf;
#       烧录 pyocd flash -e sector -t nrf52840 -f 1000000 <hex>（WCH-Link 限 1MHz SWD）。
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
